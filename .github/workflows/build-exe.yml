name: Build Windows Command Launcher

on:
  push:
    branches:
      - main
    paths:
      - 'windows_cmd_launcher.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create requirements.txt
      run: |
        echo "pyinstaller==6.3.0" > requirements.txt
        echo "PyQt5==5.15.10" >> requirements.txt
        echo "chardet" >> requirements.txt
      shell: powershell

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      shell: powershell

    - name: Configure PowerShell encoding
      run: |
        [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
        $PSDefaultParameterValues['Out-File:Encoding'] = 'utf8'
      shell: powershell

    - name: Check and fix file encoding
      run: |
        $script_path = "windows_cmd_launcher.py"
        
        $encoding_script = @"
        import sys
        import os
        import chardet
        
        def fix_encoding(file_path):
            with open(file_path, 'rb') as file:
                raw_data = file.read()
            
            result = chardet.detect(raw_data)
            encoding = result['encoding']
            
            encodings_to_try = ['utf-8', 'utf-16', 'gbk', 'gb2312', 'windows-1252', 'latin-1']
            if encoding:
                encodings_to_try.insert(0, encoding)
            
            content = None
            for enc in encodings_to_try:
                try:
                    content = raw_data.decode(enc)
                    break
                except:
                    continue
            
            if content is None:
                content = raw_data.decode('utf-8', errors='ignore')
            
            lines = content.split('\n')
            has_encoding = any('coding' in line and 'utf-8' in line.lower() for line in lines[:2])
            
            if not has_encoding:
                if lines[0].startswith('#!'):
                    lines.insert(1, '# -*- coding: utf-8 -*-')
                else:
                    lines.insert(0, '# -*- coding: utf-8 -*-')
                content = '\n'.join(lines)
            
            with open(file_path, 'w', encoding='utf-8') as file:
                file.write(content)
        
        if __name__ == '__main__':
            file_path = sys.argv[1] if len(sys.argv) > 1 else None
            if file_path and os.path.exists(file_path):
                fix_encoding(file_path)
        "@
        
        $encoding_script | Out-File -FilePath "fix_encoding.py" -Encoding utf8
        python fix_encoding.py "$script_path"
      shell: powershell

    - name: Create PyInstaller spec file
      run: |
        $spec_content = @"
        # -*- coding: utf-8 -*-
        import sys
        from PyInstaller.building.api import PYZ, EXE
        from PyInstaller.building.build_main import Analysis
        
        if hasattr(sys.stdout, 'reconfigure'):
            sys.stdout.reconfigure(encoding='utf-8')
        if hasattr(sys.stderr, 'reconfigure'):
            sys.stderr.reconfigure(encoding='utf-8')
        
        block_cipher = None
        
        a = Analysis(
            ['windows_cmd_launcher.py'],
            pathex=[],
            binaries=[],
            datas=[],
            hiddenimports=[
                'PyQt5.QtCore',
                'PyQt5.QtGui',
                'PyQt5.QtWidgets',
            ],
            hookspath=[],
            hooksconfig={},
            runtime_hooks=[],
            excludes=[],
            win_no_prefer_redirects=False,
            win_private_assemblies=False,
            cipher=block_cipher,
            noarchive=False,
        )
        
        pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher)
        
        exe = EXE(
            pyz,
            a.scripts,
            a.binaries,
            a.zipfiles,
            a.datas,
            [],
            name='WindowsCmdLauncher',
            debug=False,
            bootloader_ignore_signals=False,
            strip=False,
            upx=True,
            upx_exclude=[],
            runtime_tmpdir=None,
            console=False,
            disable_windowed_traceback=False,
            argv_emulation=False,
            target_arch=None,
            codesign_identity=None,
            entitlements_file=None,
            icon=None,
        )
        "@
        
        $spec_content | Out-File -FilePath "windows_cmd_launcher.spec" -Encoding utf8
      shell: powershell

    - name: Build EXE with PyInstaller
      run: |
        echo "Building EXE..."
        pyinstaller --clean --log-level INFO windows_cmd_launcher.spec
        
        if (Test-Path "dist/WindowsCmdLauncher.exe") {
          echo "Build successful!"
          $exe_size = (Get-Item "dist/WindowsCmdLauncher.exe").Length / 1MB
          echo "EXE size: $([math]::Round($exe_size, 2)) MB"
        } else {
          echo "Build failed!"
          exit 1
        }
      shell: powershell

    - name: Create README
      run: |
        $info = @"
        Windows Command Launcher
        =========================
        
        Build Date: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss")
        
        Features:
        - 35+ Windows management commands
        - Dark theme UI
        - Customizable layout
        
        Usage:
        1. Run WindowsCmdLauncher.exe
        2. Click buttons to launch tools
        3. Use Settings to customize
        "@
        
        $info | Out-File -FilePath "dist/README.txt" -Encoding utf8
      shell: powershell

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: WindowsCmdLauncher
        path: |
          dist/WindowsCmdLauncher.exe
          dist/README.txt
        retention-days: 90

    - name: Create Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: WindowsCmdLauncher v1.0.${{ github.run_number }}
        body: |
          ## Windows Command Launcher
          
          自动构建，单文件 EXE，包含所有依赖。
          
          ### 使用方法
          1. 下载 WindowsCmdLauncher.exe
          2. 双击运行
          3. 点击按钮启动 Windows 工具
        files: |
          dist/WindowsCmdLauncher.exe
          dist/README.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Show download link
      run: |
        echo "=========================================="
        echo "Build completed!"
        echo "Download: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        echo "=========================================="
      shell: powershell
