name: Build Windows Command Launcher to EXE

on:
  push:
    branches:
      - main
    paths:
      - 'windows_cmd_launcher.py'
  workflow_dispatch:
    inputs:
      branchRef:
        description: 'Branch to deploy'
        required: true
        default: 'main'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    # 1. Checkout代码
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    # 2. 创建requirements.txt
    - name: Create requirements.txt
      run: |
        echo "pyinstaller==6.3.0" > requirements.txt
        echo "PyQt5==5.15.10" >> requirements.txt
        echo "chardet" >> requirements.txt
      shell: powershell

    # 3. 设置Python 3.11
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # 4. 验证Python版本
    - name: Verify Python version
      run: |
        python --version
        pip --version
      shell: powershell

    # 5. 缓存pip包
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-pyqt5-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-pyqt5-

    # 6. 安装依赖
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      shell: powershell

    # 7. 缓存PyInstaller构建文件
    - name: Cache PyInstaller build files
      uses: actions/cache@v3
      with:
        path: |
          build
          dist
        key: ${{ runner.os }}-pyinstaller-pyqt5-${{ hashFiles('windows_cmd_launcher.py') }}
        restore-keys: |
          ${{ runner.os }}-pyinstaller-pyqt5-

    # 8. 设置PowerShell使用UTF-8
    - name: Configure PowerShell encoding
      run: |
        [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
        $PSDefaultParameterValues['Out-File:Encoding'] = 'utf8'
        $PSDefaultParameterValues['*:Encoding'] = 'utf8'
      shell: powershell

    # 9. 检查并修复文件编码
    - name: Check and fix file encoding
      run: |
        $script_path = "windows_cmd_launcher.py"
        
        echo "Checking encoding of Python script: $script_path"
        
        $encoding_script = @"
        import sys
        import os
        import chardet
        
        def fix_encoding(file_path):
            with open(file_path, 'rb') as file:
                raw_data = file.read()
            
            result = chardet.detect(raw_data)
            encoding = result['encoding']
            confidence = result['confidence']
            
            print(f`"Detected encoding: {encoding} with confidence: {confidence}`")
            
            encodings_to_try = []
            if encoding and confidence > 0.5:
                encodings_to_try.append(encoding)
            
            for enc in ['utf-8', 'utf-16', 'gbk', 'gb2312', 'windows-1252', 'latin-1']:
                if enc.lower() != encoding.lower() if encoding else True:
                    encodings_to_try.append(enc)
            
            content = None
            for enc in encodings_to_try:
                try:
                    content = raw_data.decode(enc)
                    print(f`"Successfully decoded with {enc}`")
                    break
                except UnicodeDecodeError:
                    continue
            
            if content is None:
                content = raw_data.decode('utf-8', errors='ignore')
            
            lines = content.split('\n')
            has_encoding = False
            for line in lines[:2]:
                if 'coding' in line and 'utf-8' in line.lower():
                    has_encoding = True
                    break
            
            if not has_encoding:
                if lines[0].startswith('#!'):
                    lines.insert(1, '# -*- coding: utf-8 -*-')
                else:
                    lines.insert(0, '# -*- coding: utf-8 -*-')
                content = '\n'.join(lines)
            
            with open(file_path, 'w', encoding='utf-8') as file:
                file.write(content)
            
            print(`"File saved with UTF-8 encoding`")
        
        if __name__ == '__main__':
            file_path = sys.argv[1] if len(sys.argv) > 1 else None
            if file_path and os.path.exists(file_path):
                fix_encoding(file_path)
        "@
        
        $encoding_script | Out-File -FilePath "fix_encoding.py" -Encoding utf8
        python fix_encoding.py "$script_path"
      shell: powershell

    # 10. 创建PyInstaller spec文件
    - name: Create PyInstaller spec file
      run: |
        $spec_content = @"
        # -*- coding: utf-8 -*-
        import sys
        from PyInstaller.building.api import PYZ, EXE
        from PyInstaller.building.build_main import Analysis
        
        if hasattr(sys.stdout, 'reconfigure'):
            sys.stdout.reconfigure(encoding='utf-8')
        if hasattr(sys.stderr, 'reconfigure'):
            sys.stderr.reconfigure(encoding='utf-8')
        
        block_cipher = None
        
        a = Analysis(
            ['windows_cmd_launcher.py'],
            pathex=[],
            binaries=[],
            datas=[],
            hiddenimports=[
                'PyQt5.QtCore',
                'PyQt5.QtGui',
                'PyQt5.QtWidgets',
            ],
            hookspath=[],
            hooksconfig={},
            runtime_hooks=[],
            excludes=[],
            win_no_prefer_redirects=False,
            win_private_assemblies=False,
            cipher=block_cipher,
            noarchive=False,
        )
        
        pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher)
        
        exe = EXE(
            pyz,
            a.scripts,
            a.binaries,
            a.zipfiles,
            a.datas,
            [],
            name='WindowsCmdLauncher',
            debug=False,
            bootloader_ignore_signals=False,
            strip=False,
            upx=True,
            upx_exclude=[],
            runtime_tmpdir=None,
            console=False,
            disable_windowed_traceback=False,
            argv_emulation=False,
            target_arch=None,
            codesign_identity=None,
            entitlements_file=None,
            icon=None,
        )
        "@
        
        $spec_content | Out-File -FilePath "windows_cmd_launcher.spec" -Encoding utf8
      shell: powershell

    # 11. 使用PyInstaller构建EXE
    - name: Build EXE with PyInstaller
      run: |
        echo "Building EXE with all dependencies included..."
        
        pyinstaller --clean --log-level INFO windows_cmd_launcher.spec
        
        if (Test-Path "dist/WindowsCmdLauncher/WindowsCmdLauncher.exe") {
          echo "Build successful!"
          $exe_size = (Get-Item "dist/WindowsCmdLauncher/WindowsCmdLauncher.exe").Length / 1MB
          $rounded_size = [math]::Round($exe_size, 2)
          echo "EXE size: $rounded_size MB"
          
          $folder_size = (Get-ChildItem "dist/WindowsCmdLauncher" -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
          $rounded_folder_size = [math]::Round($folder_size, 2)
          echo "Total package size: $rounded_folder_size MB"
        } else {
          echo "Build failed - EXE not found!"
          exit 1
        }
      shell: powershell

    # 12. 创建发布信息
    - name: Create release info
      run: |
        $info = @"
        Windows Command Launcher - Release Information
        ================================================
        
        Build Date: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss")
        Python Version: $(python --version)
        PyQt5 Version: $(pip show PyQt5 | Select-String "Version")
        PyInstaller Version: $(pip show pyinstaller | Select-String "Version")
        
        File Information:
        - Executable: WindowsCmdLauncher.exe
        - Type: Single file executable with all dependencies included
        - No installation required
        - Standalone application
        
        Features:
        - Quick access to Windows management tools
        - Categorized command buttons
        - Customizable button size and layout
        - macOS-style dark theme
        - Grid layout with adjustable columns
        
        Supported Commands:
        - System Management (9 commands)
        - Network Management (4 commands)
        - User & Security (4 commands)
        - Group Policy (2 commands)
        - Control Panel (8 commands)
        - Other Tools (8 commands)
        
        Requirements:
        - Windows 10/11
        - No administrator privileges required for the launcher
        - Some commands may require elevated permissions
        
        How to Use:
        1. Run WindowsCmdLauncher.exe
        2. Click any button to launch the corresponding Windows tool
        3. Use Settings to customize button appearance
        4. Hover over buttons to see command descriptions
        
        Customization:
        - Button Width: 80-300px
        - Button Height: 40-200px
        - Border Radius: 0-30px
        - Grid Columns: 2-10 columns per row
        "@
        
        $info | Out-File -FilePath "dist/README.txt" -Encoding utf8
        echo "Release info created"
      shell: powershell

    # 13. 上传EXE作为artifact
    - name: Upload EXE as artifact
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Command-Launcher
        path: |
          dist/WindowsCmdLauncher.exe
          dist/README.txt
        retention-days: 90

    # 14. 创建GitHub Release
    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Windows Command Launcher v1.0.${{ github.run_number }}
        body: |
          ## Windows Command Launcher
          
          自动构建的独立可执行文件，包含所有依赖（PyQt5）。
          
          ### 功能特性
          - 🚀 快速启动Windows管理工具
          - 📊 分类显示35+常用命令
          - 🎨 macOS风格暗色主题
          - ⚙️ 可自定义按钮大小和布局
          - 🔍 悬停显示命令说明
          - 💾 设置自动保存
          
          ### 命令分类
          - **系统管理**: 计算机管理、设备管理器、磁盘管理等
          - **网络管理**: 网络连接、防火墙设置等
          - **用户安全**: 用户管理、安全策略等
          - **组策略**: 策略编辑器等
          - **控制面板**: 程序管理、系统属性等
          - **其他工具**: 注册表、任务管理器等
          
          ### 使用方法
          1. 下载 `WindowsCmdLauncher.exe`
          2. 双击运行（部分命令可能需要管理员权限）
          3. 点击按钮启动对应工具
          4. 通过设置自定义界面
          
          ### 系统要求
          - Windows 10/11
          - 单文件，无需安装
          - 约 30-40 MB
          
          构建时间: ${{ github.event.head_commit.timestamp }}
          
          ### 下载说明
          - **WindowsCmdLauncher.exe**: 主程序
          - **README.txt**: 详细说明文档
        files: |
          dist/WindowsCmdLauncher.exe
          dist/README.txt
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # 15. 显示下载链接
    - name: Post download link
      run: |
        echo "=========================================="
        echo "Build completed successfully!"
        echo "=========================================="
        echo ""
        echo "Download your EXE from:"
        echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        echo ""
        echo "Or check the latest release at:"
        echo "https://github.com/${{ github.repository }}/releases/latest"
        echo ""
        echo "File: WindowsCmdLauncher.exe"
        echo "Size: ~30-40 MB (includes PyQt5)"
        echo ""
        echo "=========================================="
      shell: powershell
