name: Build VirtioFS Mount GUI to EXE

on:
  push:
    branches:
      - main
    paths:
      - 'virtiofs_mount_gui.py'  # 只在这个文件改变时触发
  workflow_dispatch:
    inputs:
      branchRef:
        description: 'Branch to deploy'
        required: true
        default: 'main'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    # 1. Checkout代码
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    # 2. 创建requirements.txt，包含PyQt5和PyInstaller
    - name: Create requirements.txt
      run: |
        echo "pyinstaller==6.3.0" > requirements.txt
        echo "PyQt5==5.15.10" >> requirements.txt
        echo "chardet" >> requirements.txt
      shell: powershell

    # 3. 设置Python 3.10
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 4. 验证Python版本
    - name: Verify Python version
      run: |
        python --version
        pip --version
      shell: powershell

    # 5. 缓存pip包
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-pyqt5-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-pyqt5-

    # 6. 安装依赖
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      shell: powershell

    # 7. 缓存PyInstaller构建文件
    - name: Cache PyInstaller build files
      uses: actions/cache@v3
      with:
        path: |
          build
          dist
        key: ${{ runner.os }}-pyinstaller-pyqt5-${{ hashFiles('virtiofs_mount_gui.py') }}
        restore-keys: |
          ${{ runner.os }}-pyinstaller-pyqt5-

    # 8. 设置PowerShell使用UTF-8
    - name: Configure PowerShell encoding
      run: |
        [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
        $PSDefaultParameterValues['Out-File:Encoding'] = 'utf8'
        $PSDefaultParameterValues['*:Encoding'] = 'utf8'
      shell: powershell

    # 9. 检查并修复文件编码
    - name: Check and fix file encoding
      run: |
        $script_path = "virtiofs_mount_gui.py"
        
        echo "Checking encoding of Python script: $script_path"
        
        # 创建编码修复脚本
        $encoding_script = @"
        import sys
        import os
        import chardet
        
        def fix_encoding(file_path):
            with open(file_path, 'rb') as file:
                raw_data = file.read()
            
            result = chardet.detect(raw_data)
            encoding = result['encoding']
            confidence = result['confidence']
            
            print(f"Detected encoding: {encoding} with confidence: {confidence}")
            
            encodings_to_try = []
            if encoding and confidence > 0.5:
                encodings_to_try.append(encoding)
            
            for enc in ['utf-8', 'utf-16', 'gbk', 'gb2312', 'windows-1252', 'latin-1']:
                if enc.lower() != encoding.lower() if encoding else True:
                    encodings_to_try.append(enc)
            
            content = None
            for enc in encodings_to_try:
                try:
                    content = raw_data.decode(enc)
                    print(f"Successfully decoded with {enc}")
                    break
                except UnicodeDecodeError:
                    continue
            
            if content is None:
                content = raw_data.decode('utf-8', errors='ignore')
            
            lines = content.split('\n')
            has_encoding = False
            for line in lines[:2]:
                if 'coding' in line and 'utf-8' in line.lower():
                    has_encoding = True
                    break
            
            if not has_encoding:
                if lines[0].startswith('#!'):
                    lines.insert(1, '# -*- coding: utf-8 -*-')
                else:
                    lines.insert(0, '# -*- coding: utf-8 -*-')
                content = '\n'.join(lines)
            
            with open(file_path, 'w', encoding='utf-8') as file:
                file.write(content)
            
            print("File saved with UTF-8 encoding")
        
        if __name__ == '__main__':
            file_path = sys.argv[1] if len(sys.argv) > 1 else None
            if file_path and os.path.exists(file_path):
                fix_encoding(file_path)
        "@
        
        $encoding_script | Out-File -FilePath "fix_encoding.py" -Encoding utf8
        python fix_encoding.py "$script_path"
      shell: powershell

    # 10. 创建PyInstaller spec文件
    - name: Create PyInstaller spec file
      run: |
        $spec_content = @"
        # -*- coding: utf-8 -*-
        import sys
        from PyInstaller.building.api import PYZ, EXE
        from PyInstaller.building.build_main import Analysis
        
        # 设置正确的编码
        if hasattr(sys.stdout, 'reconfigure'):
            sys.stdout.reconfigure(encoding='utf-8')
        if hasattr(sys.stderr, 'reconfigure'):
            sys.stderr.reconfigure(encoding='utf-8')
        
        block_cipher = None
        
        a = Analysis(
            ['virtiofs_mount_gui.py'],
            pathex=[],
            binaries=[],
            datas=[],
            hiddenimports=[
                'PyQt5.QtCore',
                'PyQt5.QtGui',
                'PyQt5.QtWidgets',
            ],
            hookspath=[],
            hooksconfig={},
            runtime_hooks=[],
            excludes=[],
            win_no_prefer_redirects=False,
            win_private_assemblies=False,
            cipher=block_cipher,
            noarchive=False,
        )
        
        pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher)
        
        exe = EXE(
            pyz,
            a.scripts,
            a.binaries,
            a.zipfiles,
            a.datas,
            [],
            name='VirtioFS_Mount_Manager',
            debug=False,
            bootloader_ignore_signals=False,
            strip=False,
            upx=True,
            upx_exclude=[],
            runtime_tmpdir=None,
            console=False,  # 设置为False可以隐藏控制台窗口
            disable_windowed_traceback=False,
            argv_emulation=False,
            target_arch=None,
            codesign_identity=None,
            entitlements_file=None,
            icon=None,  # 如果有icon文件，可以在这里指定
        )
        "@
        
        $spec_content | Out-File -FilePath "virtiofs_mount_gui.spec" -Encoding utf8
      shell: powershell

    # 11. 使用PyInstaller构建EXE（单文件模式，包含所有依赖）
    - name: Build EXE with PyInstaller
      run: |
        echo "Building EXE with all dependencies included..."
        
        # 使用spec文件构建
        pyinstaller --clean --log-level INFO virtiofs_mount_gui.spec
        
        # 检查构建是否成功
        if (Test-Path "dist/VirtioFS_Mount_Manager.exe") {
          echo "Build successful!"
          $exe_size = (Get-Item "dist/VirtioFS_Mount_Manager.exe").Length / 1MB
          echo "EXE size: $([math]::Round($exe_size, 2)) MB"
        } else {
          echo "Build failed - EXE not found!"
          exit 1
        }
      shell: powershell

    # 12. 创建发布信息
    - name: Create release info
      run: |
        $info = @"
        VirtioFS Mount Manager - Release Information
        ============================================
        
        Build Date: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss")
        Python Version: $(python --version)
        PyQt5 Version: $(pip show PyQt5 | Select-String "Version")
        PyInstaller Version: $(pip show pyinstaller | Select-String "Version")
        
        File Information:
        - Executable: VirtioFS_Mount_Manager.exe
        - Type: Single file executable with all dependencies included
        - No installation required
        
        Supported VMs:
        - vm888 (X:)
        - vm555 (Y:)
        - vm666 (J:)
        - vm777 (K:)
        
        Requirements:
        - Windows OS
        - Administrator privileges
        - VirtioFS installed at: C:\Program Files\Virtio-Win\VioFS\virtiofs.exe
        
        How to Use:
        1. Run the executable as Administrator
        2. Click the corresponding button to mount a VM
        3. Check the log for operation status
        "@
        
        $info | Out-File -FilePath "dist/README.txt" -Encoding utf8
        echo "Release info created"
      shell: powershell

    # 13. 上传EXE作为artifact
    - name: Upload EXE as artifact
      uses: actions/upload-artifact@v4
      with:
        name: VirtioFS-Mount-Manager
        path: |
          dist/VirtioFS_Mount_Manager.exe
          dist/README.txt
        retention-days: 90

    # 14. 创建GitHub Release（可选）
    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: VirtioFS Mount Manager v1.0.${{ github.run_number }}
        body: |
          ## VirtioFS Mount Manager
          
          自动构建的独立可执行文件，包含所有依赖。
          
          ### 功能特性
          - 一键挂载多个VirtioFS驱动器
          - 图形化界面，易于使用
          - 管理员权限自动检测
          - 实时操作日志显示
          
          ### 使用方法
          1. 下载 `VirtioFS_Mount_Manager.exe`
          2. 右键选择"以管理员身份运行"
          3. 点击对应按钮挂载虚拟机
          
          ### 系统要求
          - Windows 操作系统
          - 已安装 VirtioFS 驱动
          
          构建时间: ${{ github.event.head_commit.timestamp }}
        files: |
          dist/VirtioFS_Mount_Manager.exe
          dist/README.txt
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # 15. 显示下载链接
    - name: Post download link
      run: |
        echo "=========================================="
        echo "Build completed successfully!"
        echo "=========================================="
        echo ""
        echo "Download your EXE from:"
        echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        echo ""
        echo "Or check the latest release at:"
        echo "https://github.com/${{ github.repository }}/releases/latest"
        echo ""
        echo "=========================================="
      shell: powershell
